<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAjgQTdQmo63-0mR8k1bVYsY0E8I7Iqbnk",
    authDomain: "will-gasto.firebaseapp.com",
    projectId: "will-gasto",
    storageBucket: "will-gasto.firebasestorage.app",
    messagingSenderId: "436819384776",
    appId: "1:436819384776:web:37c4c1173c543c0d1dc8fd"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  // Função auxiliar para exibir feedback no card
  function exibirMensagem(texto, tipo = "err") {
    const fb = document.getElementById('feedback');
    fb.textContent = texto;
    fb.className = `msg ${tipo}`;
    fb.style.display = "block";
  }

  document.getElementById('btnLogin').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    const btn = document.getElementById('btnLogin');

    if(!email || !senha) {
      exibirMensagem("⚠️ Informe o e-mail e a senha.");
      return;
    }

    btn.disabled = true; 
    btn.textContent = "Processando..."; 
    document.getElementById('feedback').style.display = "none";

    try {
      let userRes;
      try {
        // 1. Tenta fazer o Login
        userRes = await signInWithEmailAndPassword(auth, email, senha);
      } catch (err) {
        // 2. Se a conta não existe, cria uma nova
        if (err.code === 'auth/user-not-found') {
          userRes = await createUserWithEmailAndPassword(auth, email, senha);
          await setDoc(doc(db, "usuarios", userRes.user.uid), { 
            email, 
            aprovado: false,
            criadoEm: new Date().toISOString()
          });
        } else if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') {
          // Se falhou as credenciais, verifica se o usuário tenta se cadastrar pela primeira vez
          try {
            userRes = await createUserWithEmailAndPassword(auth, email, senha);
            await setDoc(doc(db, "usuarios", userRes.user.uid), { 
              email, 
              aprovado: false,
              criadoEm: new Date().toISOString()
            });
          } catch (createErr) {
            // Se falhou ao criar porque já existe, a senha informada estava errada!
            if (createErr.code === 'auth/email-already-in-use') {
              throw new Error("Senha incorreta. Verifique os dados digitados.");
            }
            throw createErr;
          }
        } else { 
          throw err; 
        }
      }

      // 3. Verifica no Firestore a liberação do acesso
      const userDoc = await getDoc(doc(db, "usuarios", userRes.user.uid));
      
      if (userDoc.exists() && userDoc.data().aprovado === true) {
        window.location.href = "index.html"; 
      } else {
        exibirMensagem("✅ Conta criada/localizada! Faça o pagamento abaixo para liberar seu acesso.", "success");
        switchTab('pagamento');
        await signOut(auth);
      }
    } catch (e) {
      const mensagemErro = e.message.includes("Senha incorreta") 
        ? e.message 
        : "❌ Erro ao acessar. Verifique seus dados ou tente novamente.";
      exibirMensagem(mensagemErro, "err");
    } finally {
      btn.disabled = false; 
      btn.textContent = "Acessar Sistema";
    }
  };

  // Payload Pix
  const PIX_STRING = "00020126360014BR.GOV.BCB.PIX0114+55199967968515204000030398654043.005802BR5901N6001C62070503***63049D51";

  window.switchTab = (tab) => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
    document.getElementById(`section-${tab}`).classList.add('active');
    document.getElementById(`btn-tab-${tab}`).classList.add('active');
    document.getElementById('feedback').style.display = "none";
  };

  window.gerarPix = () => {
    const qrCont = document.getElementById('qrcode');
    qrCont.style.display = "block"; 
    qrCont.innerHTML = "";
    new QRCode(qrCont, { text: PIX_STRING, width: 170, height: 170 });
    document.getElementById('pix-text').textContent = PIX_STRING;
    document.getElementById('pix-area-container').style.display = "block";
  };

  window.copiarPix = () => {
    navigator.clipboard.writeText(PIX_STRING);
    alert("Código Pix Copiado!");
  };

  window.validarZap = () => {
    const nome = document.getElementById('nome-usuario').value;
    document.getElementById('btn-whatsapp').style.display = nome.trim().length >= 3 ? 'flex' : 'none';
  };

  window.enviarZap = () => {
    const nome = document.getElementById('nome-usuario').value;
    const msg = encodeURIComponent(`Olá! Fiz o pagamento de R$ 3,00 (Plano Mensal). Nome: ${nome}. Aguardo liberação do acesso.`);
    window.open(`https://wa.me/5519996796851?text=${msg}`, '_blank');
  };
</script>

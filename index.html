<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Login - Viana Controle</title>
  
  <!-- Prevenção de Cache: Força o navegador a carregar sempre a versão mais recente -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b;
      --border: #e2e8f0; --primary: #3b82f6; --vencida: #ef4444; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --border: #334155; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .login-card { width: 100%; max-width: 380px; background: var(--card); padding: 24px; border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    h1 { font-size: 22px; font-weight: 800; color: var(--primary); text-align: center; margin-bottom: 20px; }
    form { display: grid; gap: 14px; }
    label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-size: 15px; outline: none; transition: 0.2s; text-align: center; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--primary); color: white; font-weight: 700; cursor: pointer; font-size: 15px; transition: all 0.2s; margin-top: 5px; }
    .btn:active { transform: scale(0.98); }
    .error-msg { color: var(--vencida); font-size: 12px; font-weight: 600; text-align: center; display: none; margin-top: 6px; }
  </style>
</head>
<body>

<div class="login-card">
  <h1>Viana Controle</h1>
  <form id="login-form">
    <div>
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email" />
    </div>
    <div>
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
    </div>
    <div id="error" class="error-msg">E-mail ou senha incorretos.</div>
    <button type="submit" id="btn-login" class="btn">Acessar Sistema</button>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

  const config = {
    apiKey: "AIzaSyAjgQTdQmo63-0mR8k1bVYsY0E8I7Iqbnk", 
    authDomain: "will-gasto.firebaseapp.com",
    projectId: "will-gasto", 
    storageBucket: "will-gasto.firebasestorage.app",
    messagingSenderId: "436819384776", 
    appId: "1:436819384776:web:37c4c1173c543c0d1dc8fd"
  };

  const app = initializeApp(config);
  const auth = getAuth(app);

  // Se já houver login ativo, redireciona para a página interna
  onAuthStateChanged(auth, user => {
    if (user) {
      window.location.replace("app.html");
    }
  });

  const form = document.getElementById('login-form');
  const errorElem = document.getElementById('error');
  const btnLogin = document.getElementById('btn-login');

  form.onsubmit = async (e) => {
    e.preventDefault();
    errorElem.style.display = 'none';
    btnLogin.textContent = "Autenticando...";
    btnLogin.style.pointerEvents = "none";

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.replace("app.html");
    } catch (error) {
      errorElem.style.display = 'block';
      btnLogin.textContent = "Acessar Sistema";
      btnLogin.style.pointerEvents = "auto";
    }
  };
</script>
</body>
</html>
